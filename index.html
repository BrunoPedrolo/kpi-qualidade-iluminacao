<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>KPI · Qualidade · Iluminação</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{--green:#1a9e3f;--green-dark:#146b2a;--green-light:#e8f5ec;--border:#d4edda;--text:#1a2e1f;--muted:#5a7a62;--surface:#f4faf6;--white:#fff;--font:'IBM Plex Sans',sans-serif;--mono:'IBM Plex Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--surface);color:var(--text);font-family:var(--font);font-size:14px}
body{min-height:100vh}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:var(--white);border-bottom:3px solid var(--green);position:sticky;top:0;z-index:100;gap:12px}
.logo-cq img{height:80px;width:auto;display:block}
.logo-zag img{height:44px;width:auto;display:block}
.topbar-center{text-align:center;flex:1;min-width:0}
.topbar-center h1{font-size:14px;font-weight:600;color:var(--green-dark);letter-spacing:-.01em}
.topbar-center p{font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:2px}
.topbar-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.btn-upload{background:var(--green);color:#fff;border:none;border-radius:6px;padding:7px 12px;font-size:11px;font-weight:600;cursor:pointer;font-family:var(--font);white-space:nowrap}
.btn-upload:hover{background:var(--green-dark)}
.date-wrap{padding:10px 16px 0;border-bottom:1px solid var(--border);background:var(--white)}
.date-scroll{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.date-scroll::-webkit-scrollbar{display:none}
.dtab{background:transparent;border:1px solid var(--border);border-bottom:none;border-radius:6px 6px 0 0;color:var(--muted);font-size:11px;font-family:var(--mono);padding:6px 12px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.dtab.active{background:var(--green);color:#fff;border-color:var(--green);border-bottom:1px solid var(--green);margin-bottom:-1px;font-weight:500}
.setor-wrap{padding:10px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--white)}
.setor-label{font-size:11px;color:var(--muted);font-family:var(--mono)}
.stab{background:transparent;border:1px solid var(--border);border-radius:20px;color:var(--muted);font-size:11px;padding:5px 12px;cursor:pointer;white-space:nowrap}
.stab.active{background:var(--green);color:#fff;border-color:var(--green);font-weight:500}
.main{padding:16px}
.kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px}
@media(min-width:900px){.kpi-grid{grid-template-columns:repeat(4,1fr)}}
.kpi-card{background:var(--white);border:1px solid var(--border);border-radius:8px;padding:12px;border-top:3px solid var(--green)}
.kpi-card .label{font-size:10px;color:var(--muted);font-family:var(--mono);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px}
.kpi-card .val{font-size:22px;font-weight:600;font-family:var(--mono);line-height:1;color:var(--green-dark)}
.kpi-card .sub{font-size:11px;color:var(--muted);margin-top:4px;font-family:var(--mono)}
.kpi-pct{color:var(--green)!important}
.prog{width:100%;height:3px;background:var(--border);border-radius:2px;margin-top:8px;overflow:hidden}
.prog-fill{height:100%;border-radius:2px;background:var(--green)}
.status-list{display:flex;flex-direction:column;gap:4px;margin-top:2px}
.s-item{display:flex;align-items:center;gap:6px;font-size:11px;padding:4px 7px;border-radius:4px;font-family:var(--mono)}
.s-green{background:#e8f5ec;color:#146b2a}
.s-amber{background:#fef9e7;color:#875a00}
.s-red{background:#fdecea;color:#8b1a1a}
.apr-row{display:flex;gap:16px;margin-top:5px}
.apr-item .av{font-size:20px;font-weight:600;font-family:var(--mono);line-height:1}
.apr-item .al{font-size:10px;color:var(--muted);font-family:var(--mono);margin-top:2px}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sec-hdr span{font-size:10px;color:var(--muted);font-family:var(--mono);text-transform:uppercase;letter-spacing:.07em}
.insp-grid{display:grid;grid-template-columns:1fr;gap:8px}
@media(min-width:540px){.insp-grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:900px){.insp-grid{grid-template-columns:repeat(3,1fr)}}
.icard{background:var(--white);border:1px solid var(--border);border-radius:8px;padding:12px;border-left:3px solid var(--green)}
.icard.pending{opacity:.4;border-left-color:var(--border);border-style:dashed}
.icard-hdr{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:6px}
.icard-info{display:flex;align-items:center;gap:8px}
.avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;font-family:var(--mono);flex-shrink:0;background:var(--green-light);color:var(--green-dark)}
.icard-name{font-size:12px;font-weight:600;color:var(--text)}
.badge{font-size:10px;font-weight:500;padding:3px 7px;border-radius:4px;white-space:nowrap;font-family:var(--mono)}
.b-green{background:#e8f5ec;color:#146b2a}
.b-amber{background:#fef9e7;color:#875a00}
.b-red{background:#fdecea;color:#8b1a1a}
.setor-tag{display:inline-block;font-size:10px;font-family:var(--mono);padding:2px 7px;border-radius:3px;margin-bottom:8px;background:var(--green-light);color:var(--green-dark)}
.ipct{font-size:32px;font-weight:600;font-family:var(--mono);line-height:1;margin-bottom:2px}
.icount{font-size:11px;color:var(--muted);font-family:var(--mono);margin-bottom:6px}
.ibar{width:100%;height:3px;background:var(--border);border-radius:2px;overflow:hidden;margin-bottom:8px}
.ibar-fill{height:100%;border-radius:2px}
.idetail{display:flex;gap:8px;font-size:11px;font-family:var(--mono);margin-bottom:8px;flex-wrap:wrap}
.ifooter{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--border);padding-top:8px}
.ifooter-item{text-align:center}
.ifooter-val{font-size:14px;font-weight:600;font-family:var(--mono);color:var(--green-dark)}
.ifooter-lbl{font-size:9px;color:var(--muted);font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.pending-msg{font-size:11px;color:#aaa;text-align:center;padding:16px 0;font-family:var(--mono)}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:4px}
.loading-msg{text-align:center;padding:40px;font-family:var(--mono);color:var(--muted);font-size:13px;grid-column:1/-1}
/* MODAL */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:center;justify-content:center;padding:20px}
.modal-bg.open{display:flex}
.modal{background:var(--white);border-radius:12px;padding:28px;width:100%;max-width:420px}
.modal h2{font-size:16px;font-weight:600;color:var(--green-dark);margin-bottom:4px}
.modal-sub{font-size:11px;color:var(--muted);font-family:var(--mono);margin-bottom:20px}
.drop-zone{border:2px dashed var(--border);border-radius:8px;padding:24px;text-align:center;cursor:pointer;background:var(--green-light);transition:all .2s;margin-bottom:12px}
.drop-zone:hover,.drop-zone.drag{border-color:var(--green);background:#d4edda}
.dicon{font-size:28px;margin-bottom:6px}
.drop-zone p{font-size:12px;color:var(--muted);font-family:var(--mono)}
.drop-zone strong{color:var(--green-dark)}
.file-name-lbl{font-size:11px;color:var(--green-dark);font-family:var(--mono);text-align:center;min-height:16px;margin-bottom:10px}
.btn-send{width:100%;background:var(--green);color:#fff;border:none;border-radius:8px;padding:11px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font)}
.btn-send:hover{background:var(--green-dark)}
.btn-send:disabled{background:#aaa;cursor:not-allowed}
.btn-cancel{width:100%;background:transparent;color:var(--muted);border:1px solid var(--border);border-radius:8px;padding:9px;font-size:12px;cursor:pointer;font-family:var(--font);margin-top:8px}
.upload-result{margin-top:12px;padding:10px 14px;border-radius:8px;font-size:11px;font-family:var(--mono);display:none}
.upload-result.ok{background:#e8f5ec;color:#146b2a;border:1px solid #b7dfc4}
.upload-result.err{background:#fdecea;color:#8b1a1a;border:1px solid #f5b8b8}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:5px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

  <button class="stab" onclick="setSetor(this,'montagem')">Potência e Tubular</button>
  <button class="stab" onclick="setSetor(this,'apoio')">Apoio 3</button>
  <button class="stab" onclick="setSetor(this,'almo')">Almoxarifado</button>
</div>

<div class="main">
  <div class="kpi-grid" id="kpi-grid"><div class="loading-msg">Carregando dados...</div></div>
  <div class="sec-hdr"><span>Inspetores</span><span id="period-label"></span></div>
  <div class="insp-grid" id="insp-grid"></div>
</div>

  <div class="modal">
    <h2>&#x2B06; Novo upload</h2>
    <p class="modal-sub">Envie o arquivo .xlsx exportado do sistema</p>
    <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-inp').click()">
      <div class="dicon">&#x1F4C4;</div>
      <p>Clique ou arraste aqui</p>

    <button class="btn-cancel" onclick="fecharUpload()">Cancelar</button>
    <div class="upload-result" id="upload-result"></div>
  </div>
</div>

<script>
const META=21,META_MIN=18;
const API_URL='https://kpi-qualidade-iluminacao.onrender.com';
const JSON_URL='https://raw.githubusercontent.com/BrunoPedrolo/kpi-qualidade-iluminacao/main/dados.json';
const inspDef={
  'Marileia Goettems':       {setor:'montagem',setorLabel:'Ilumin. Potência e Tubular',init:'MG'},
  'Jaqueline Tais Reimundo': {setor:'montagem',setorLabel:'Ilumin. Potência e Tubular',init:'JR'},
  'Jaqueline Reimundo':      {setor:'montagem',setorLabel:'Ilumin. Potência e Tubular',init:'JR'},
  'Natan Soares':            {setor:'apoio',   setorLabel:'Apoio 3 e Ferramentaria',   init:'NS'},
  'Maristela Poter':         {setor:'almo',    setorLabel:'Almoxarifado',              init:'MP'},
  'Maristela Potter':        {setor:'almo',    setorLabel:'Almoxarifado',              init:'MP'},
  'Naiara Rossa':            {setor:'almo',    setorLabel:'Almoxarifado',              init:'NR'},
};
let dadosGlobal={dias:{}},currentDate='geral',currentSetor='todos';
const pColor=p=>p>=100?'#1a9e3f':p>=85?'#c97a00':'#c0392b';
const bClass=p=>p>=100?'b-green':p>=85?'b-amber':'b-red';
const bLabel=p=>p>=100?'▲ Superou':p>=85?'● Atingiu':'✕ Não atingiu';
const getInit=n=>(inspDef[n]||{}).init||(n.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase());
const getSetor=n=>(inspDef[n]||{}).setor||'outros';
const getSetorLabel=n=>(inspDef[n]||{}).setorLabel||'Outros';

async function carregarDados(){
  try{const r=await fetch(JSON_URL+'?t='+Date.now());if(r.ok){dadosGlobal=await r.json();inicializar();return;}}catch(e){}
  try{const r=await fetch(API_URL+'/dados');if(r.ok){dadosGlobal=await r.json();inicializar();return;}}catch(e){}
  document.getElementById('kpi-grid').innerHTML='<div class="loading-msg" style="color:#c0392b">Erro ao carregar. Recarregue a página.</div>';
}

function inicializar(){
  document.getElementById('ultima-at').textContent='Atualizado: '+(dadosGlobal.ultima_atualizacao||'—');
  const dias=Object.keys(dadosGlobal.dias||{}).sort((a,b)=>{
    const[da,ma]=a.split('/').map(Number),[db,mb]=b.split('/').map(Number);
    return ma!==mb?ma-mb:da-db;
  });
  if(dias.length>0)currentDate=dias[dias.length-1];
  const wrap=document.getElementById('date-tabs');wrap.innerHTML='';
  dias.forEach(d=>{
    const btn=document.createElement('button');
    btn.className='dtab'+(d===currentDate?' active':'');
    btn.textContent=d;btn.onclick=()=>setDate(btn,d);wrap.appendChild(btn);
  });
  const g=document.createElement('button');
  g.className='dtab'+(currentDate==='geral'?' active':'');
  g.textContent='Geral';g.onclick=()=>setDate(g,'geral');wrap.appendChild(g);
  render();
}

function getDadosDia(name,date){
  const dias=dadosGlobal.dias||{};
  if(date==='geral'){
    const entries=Object.values(dias).map(d=>d[name]).filter(Boolean);
    if(!entries.length)return{t:0,apr:0,rep:0,noData:true};
    return{t:entries.reduce((a,b)=>a+b.t,0),apr:entries.reduce((a,b)=>a+b.apr,0),rep:entries.reduce((a,b)=>a+b.rep,0),dias:entries.length};
  }
  const d=(dias[date]||{})[name];
  if(!d)return{t:0,apr:0,rep:0,noData:true};
  return{...d,dias:1};
}

function render(){
  const dias=dadosGlobal.dias||{};
  const todosInsp=[...new Set(Object.values(dias).flatMap(d=>Object.keys(d)))];
  Object.keys(inspDef).forEach(n=>{if(!todosInsp.includes(n))todosInsp.push(n)});
  const names=todosInsp.filter(n=>currentSetor==='todos'||getSetor(n)===currentSetor);
  const data={};names.forEach(n=>data[n]=getDadosDia(n,currentDate));
  const withData=names.filter(n=>data[n].t>0);
  const tI=withData.reduce((a,n)=>a+data[n].t,0);
  const tA=withData.reduce((a,n)=>a+data[n].apr,0);
  const tR=withData.reduce((a,n)=>a+data[n].rep,0);
  const tM=withData.length*META;
  const pG=tM?Math.round(tI/tM*100):0;
  const sup=withData.filter(n=>data[n].t>=META).length;
  const ati=withData.filter(n=>data[n].t>=META_MIN&&data[n].t<META).length;
  const aba=withData.filter(n=>data[n].t>0&&data[n].t<META_MIN).length;
  const aP=tI?Math.round(tA/tI*100):0;
  document.getElementById('period-label').textContent=currentDate==='geral'?'período completo':'dia '+currentDate+'/2026';
  document.getElementById('kpi-grid').innerHTML=`
    <div class="kpi-card"><div class="label">Realizadas</div><div class="val">${tI.toLocaleString('pt-BR')}</div><div class="sub">meta · ${tM.toLocaleString('pt-BR')}</div><div class="prog"><div class="prog-fill" style="width:${Math.min(100,pG)}%"></div></div></div>
    <div class="kpi-card"><div class="label">% da meta</div><div class="val kpi-pct">${pG}%</div><div class="sub">${withData.length} com dados</div></div>
    <div class="kpi-card"><div class="label">Status</div><div class="status-list">
      <div class="s-item s-green"><span class="dot" style="background:#1a9e3f"></span>${sup} superou</div>
      <div class="s-item s-amber"><span class="dot" style="background:#c97a00"></span>${ati} atingiu</div>
      <div class="s-item s-red"><span class="dot" style="background:#c0392b"></span>${aba} abaixo</div></div></div>
    <div class="kpi-card"><div class="label">Aprovação</div><div class="apr-row">
      <div class="apr-item"><div class="av" style="color:#1a9e3f">${tA}</div><div class="al">😊 apr.</div></div>
      <div class="apr-item"><div class="av" style="color:#c0392b">${tR}</div><div class="al">😞 rep.</div></div></div>
      <div class="prog"><div class="prog-fill" style="width:${aP}%"></div></div>
      <div class="sub" style="margin-top:4px">${aP}% aprovação</div></div>`;
  const grid=document.getElementById('insp-grid');grid.innerHTML='';
  names.forEach(name=>{
    const d=data[name],card=document.createElement('div');
    card.className='icard'+((!d.t)?' pending':'');
    const init=getInit(name),sl=getSetorLabel(name);
    if(!d.t){
      card.innerHTML=`<div class="icard-hdr"><div class="icard-info"><div class="avatar">${init}</div><div class="icard-name">${name}</div></div></div><span class="setor-tag">${sl}</span><div class="pending-msg">sem dados</div>`;
    } else {
      const pct=Math.round(d.t/META*100),bc=pColor(pct),apc=Math.round(d.apr/d.t*100);
      card.innerHTML=`
        <div class="icard-hdr"><div class="icard-info"><div class="avatar">${init}</div><div class="icard-name">${name}</div></div><span class="badge ${bClass(pct)}">${bLabel(pct)}</span></div>
        <span class="setor-tag">${sl}</span>
        <div class="ipct" style="color:${bc}">${pct}%</div>
        <div class="icount">${d.t} insp · meta ${META}${d.dias>1?' · '+d.dias+' dias':''}</div>
        <div class="ibar"><div class="ibar-fill" style="width:${Math.min(100,pct)}%;background:${bc}"></div></div>
        <div class="idetail"><span style="color:#1a9e3f">😊 ${d.apr} apr.</span><span style="color:#c0392b">😞 ${d.rep} rep.</span><span style="color:var(--muted)">${apc}% ok</span></div>
        <div class="ifooter">
          <div class="ifooter-item"><div class="ifooter-val">${d.t}</div><div class="ifooter-lbl">realizadas</div></div>
          <div class="ifooter-item"><div class="ifooter-val">${META}</div><div class="ifooter-lbl">meta</div></div>
          <div class="ifooter-item"><div class="ifooter-val" style="color:${bc}">${pct}%</div><div class="ifooter-lbl">ating.</div></div>
        </div>`;
    }
    grid.appendChild(card);
  });
}

function setDate(btn,d){document.querySelectorAll('.dtab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');currentDate=d;render();}
function setSetor(btn,s){document.querySelectorAll('.stab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');currentSetor=s;render();}

/* UPLOAD MODAL */
let selFile=null;
const dz=document.getElementById('drop-zone'),fi=document.getElementById('file-inp');
const bs=document.getElementById('btn-send'),fnl=document.getElementById('file-name-lbl'),ur=document.getElementById('upload-result');
function abrirUpload(){document.getElementById('modal-bg').classList.add('open');selFile=null;fnl.textContent='';bs.disabled=true;bs.textContent='Selecione um arquivo';ur.style.display='none';}
function fecharUpload(){document.getElementById('modal-bg').classList.remove('open');}
document.getElementById('modal-bg').addEventListener('click',e=>{if(e.target===e.currentTarget)fecharUpload();});
dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('drag');});
dz.addEventListener('dragleave',()=>dz.classList.remove('drag'));
dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('drag');const f=e.dataTransfer.files[0];if(f&&f.name.endsWith('.xlsx'))setFile(f);});
fi.addEventListener('change',()=>{if(fi.files[0])setFile(fi.files[0]);});
function setFile(f){selFile=f;fnl.textContent='📄 '+f.name;bs.disabled=false;bs.textContent='Enviar dados';ur.style.display='none';}
async function enviarUpload(){
  if(!selFile)return;
  bs.disabled=true;bs.innerHTML='<span class="spinner"></span>Processando...';ur.style.display='none';
  const form=new FormData();form.append('file',selFile);
  try{
    const r=await fetch(API_URL+'/upload',{method:'POST',body:form});
    const j=await r.json();
    if(r.ok&&j.sucesso){
      ur.className='upload-result ok';
      ur.innerHTML='✅ '+j.mensagem+'<br>Dias: '+j.dias_processados.join(', ');
      bs.textContent='✓ Enviado!';
      setTimeout(()=>{fecharUpload();carregarDados();},2000);
    } else {
      ur.className='upload-result err';ur.innerHTML='❌ '+(j.erro||'Erro ao processar');
      bs.disabled=false;bs.textContent='Tentar novamente';
    }
  }catch(e){
    ur.className='upload-result err';ur.innerHTML='❌ Servidor indisponível. Aguarde ~1 min e tente novamente.';
    bs.disabled=false;bs.textContent='Tentar novamente';
  }
  ur.style.display='block';
}
carregarDados();
setInterval(carregarDados,5*60*1000);
</script>
</body>
